    <style>
      @font-face { 
        font-family: 'MyCustomTitle'; 
        src: url('/fonts/EarlySummerSerif-Regular.woff') format('woff'); 
        font-weight: 400; 
        font-style: normal; 
        font-display: swap; 
      }
      @font-face { 
        font-family: 'MyCustomTitle'; 
        src: url('/fonts/EarlySummerSerif-Medium.woff') format('woff'); 
        font-weight: 500; 
        font-style: normal; 
        font-display: swap; 
      }
      @font-face { 
        font-family: 'MyCustomBody'; 
        src: url('/fonts/EarlySummerSerif-Light.woff') format('woff'); 
        font-weight: 300; 
        font-style: normal; 
        font-display: swap; 
      }
      @font-face { 
        font-family: 'JingHuaLaoSongTi'; 
        src: url('/fonts/jinghualaosongti.woff') format('woff'); 
        font-weight: 400; 
        font-style: normal; 
        font-display: swap; 
      }
     
      :root {
        --link-color: #206da0;
        --link-hover-color: #154e78;
        --link-mark-color: #cfdfeb;
        --bg-color: #e3e4e2;
        --noise-url: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.025'/%3E%3C/svg%3E");
      }

      .font-nav-link {
        font-family: 'JingHuaLaoSongTi', 'MyCustomTitle', 'Noto Serif SC', serif;
        font-weight: 400;
        font-synthesis: none;
      }

      body { 
        background-color: var(--bg-color); 
        background-image: var(--noise-url); 
        background-attachment: fixed; 
        color: #111212;
        margin: 0; 
        padding: 0; 
        -webkit-tap-highlight-color: transparent;
      }
      
      .bg-texture { 
        background-color: var(--bg-color);
        background-image: var(--noise-url); 
        background-attachment: fixed;
      }
      
      .jagged-bottom { 
        -webkit-mask: linear-gradient(-135deg, transparent 6px, #000 0) 0 50%, linear-gradient(135deg, transparent 6px, #000 0) 0 50%; 
        -webkit-mask-size: 12px 100%; 
        -webkit-mask-repeat: repeat-x; 
        -webkit-mask-position: left bottom; 
      }
      .jagged-top { 
        -webkit-mask: linear-gradient(45deg, transparent 6px, #000 0) 0 50%, linear-gradient(-45deg, transparent 6px, #000 0) 0 50%; 
        -webkit-mask-size: 12px 100%; 
        -webkit-mask-repeat: repeat-x; 
        -webkit-mask-position: left top; 
      }
      .jagged-right-round {
        -webkit-mask-image: radial-gradient(circle at right, transparent 4px, #000 5px);
        -webkit-mask-size: 100% 34px;
        -webkit-mask-repeat: repeat-y;
        -webkit-mask-position: right top;
      }
      
      .sawtooth-y { 
        background-image: linear-gradient(135deg, #f1f0ec 25%, transparent 25%), linear-gradient(225deg, #f1f0ec 25%, transparent 25%);
        background-position: 0 0; 
        background-size: 16px 16px; 
        height: 8px; 
        width: 100%; 
      }

      .ticket-nav-sheet {
        -webkit-mask-image: radial-gradient(circle at 12px 100%, transparent 0 6px, #000 6.5px);
        mask-image: radial-gradient(circle at 12px 100%, transparent 0 6px, #000 6.5px);
        -webkit-mask-size: 24px 100%;
        mask-size: 24px 100%;
        -webkit-mask-repeat: repeat-x;
        mask-repeat: repeat-x;
        -webkit-mask-position: left bottom;
        mask-position: left bottom;
      }

      @keyframes pageSoftReveal {
        from {
          opacity: 0;
          transform: translateY(12px);
          filter: blur(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }

      .page-enter-soft {
        animation: pageSoftReveal 560ms cubic-bezier(0.19, 1, 0.22, 1) both;
      }

      .motion-card {
        transform: translateZ(0);
        transition:
          transform 260ms cubic-bezier(0.19, 1, 0.22, 1),
          border-color 260ms ease,
          background-color 260ms ease,
          opacity 260ms ease;
        will-change: transform;
      }

      .motion-card-media {
        transition:
          transform 420ms cubic-bezier(0.19, 1, 0.22, 1),
          opacity 420ms ease;
      }

      .profile-nav-track {
        --nav-active-index: 0;
        position: relative;
        padding-bottom: 5px;
      }

      .profile-nav-track::after {
        content: "";
        position: absolute;
        left: calc((var(--nav-active-index) * 25%) + 14px);
        bottom: 1px;
        width: calc(25% - 28px);
        height: 4px;
        border-radius: 999px;
        background: rgba(17, 18, 18, 0.42);
        box-shadow: 0 0 0 1px rgba(241, 240, 236, 0.36);
        transform-origin: center;
        transition:
          left 420ms cubic-bezier(0.19, 1, 0.22, 1),
          width 260ms ease,
          opacity 260ms ease;
        opacity: 0.86;
      }

      a.content-link {
        color: var(--link-color);
        text-decoration: none;
      }
      a.content-link:hover { color: var(--link-hover-color); }
      a.content-link:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
        border-radius: 2px;
      }
      .article-link {
        overflow-wrap: anywhere;
      }
      .article-link.line-through { text-decoration-line: line-through; }
      .article-link-mark {
        display: inline-block;
        position: relative;
        width: 1.24em;
        height: 1.24em;
        flex: none;
        border-radius: 50%;
        background-color: var(--link-mark-color);
        line-height: 1;
      }
      .article-link-mark > * {
        position: absolute;
        inset: 0;
        margin: auto;
      }
      .article-link > .article-link-mark {
        margin-inline-end: .24em;
        vertical-align: -.25em;
      }
      .apple-link-icon {
        display: block;
        width: 1.04em;
        height: 1.04em;
        background-color: currentColor;
        -webkit-mask: url('/fonts/apple.svg') center / contain no-repeat;
        mask: url('/fonts/apple.svg') center / contain no-repeat;
      }
      .notion-link-initial {
        display: inline-grid;
        place-items: center;
        width: 1em;
        height: 1em;
        box-sizing: border-box;
        border: 1px solid currentColor;
        border-radius: 2px;
        font: bold .74em/1 Georgia, serif;
      }
      .nav-popover-link {
        position: relative;
      }

      .nav-popover-link::before {
        content: "";
        position: absolute;
        left: 0;
        top: 12px;
        bottom: 12px;
        width: 2px;
        background: rgba(95, 125, 141, 0.72);
        transform: scaleY(0);
        transform-origin: center;
        transition: transform 220ms cubic-bezier(0.19, 1, 0.22, 1);
      }

      .nav-popover-link.is-active::before,
      .nav-popover-link:hover::before {
        transform: scaleY(1);
      }

      @media (hover: hover) and (pointer: fine) {
        .motion-card:hover {
          transform: translateY(-4px);
        }

        .motion-card:hover .motion-card-media {
          transform: scale(1.024);
        }

        .profile-nav-track:hover::after {
          opacity: 1;
        }

        .profile-nav-link:hover {
          transform: translateY(-2px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .page-enter-soft,
        .motion-card,
        .motion-card-media,
        .profile-nav-track::after,
        .nav-popover-link::before {
          animation: none !important;
          transition: none !important;
          transform: none !important;
        }
      }

      /* 针对 iOS Safari 的 100vh 修复 */
      .min-h-screen {
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
